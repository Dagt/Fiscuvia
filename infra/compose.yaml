name: fiscuvia-local
services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: fiscuvia_local
      POSTGRES_USER: fiscuvia_bootstrap
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?Generate infra/.env first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Generate infra/.env first}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Generate infra/.env first}
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U fiscuvia_bootstrap -d fiscuvia_local"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    restart: "no"
volumes:
  postgres_data:
