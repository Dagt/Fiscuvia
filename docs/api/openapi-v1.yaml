openapi: 3.1.0
info:
  title: Fiscuvia API — contratos implementados
  version: 1.0.0
  description: "Contratos implementados #24–34. BFF OIDC local, sesiones JDBC, despachos, equipo, límites y
    contribuyentes. RFC validado localmente; sin verificación SAT ni proveedor de identidad de producción
    aprobado."
servers:
  - url: /api/v1
security: []
x-error-statuses:
  BAD_REQUEST: 400
  INVALID_PAGINATION: 400
  AUTHENTICATION_REQUIRED: 401
  ACCESS_DENIED: 403
  NOT_FOUND: 404
  METHOD_NOT_ALLOWED: 405
  NOT_ACCEPTABLE: 406
  QUOTA_UNAVAILABLE: 409
  CONFLICT: 409
  STALE_VERSION: 409
  IDEMPOTENCY_KEY_REUSED: 409
  PAYLOAD_TOO_LARGE: 413
  UNSUPPORTED_MEDIA_TYPE: 415
  VALIDATION_FAILED: 422
  RATE_LIMITED: 429
  INTERNAL_ERROR: 500
paths:
  /public/info:
    get:
      operationId: getPlatformInfo
      summary: Consultar información pública de Fiscuvia
      security: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Identidad pública del producto; sin datos de usuarios ni infraestructura
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInfo"
              example:
                productName: Fiscuvia
                tagline: Todo tu despacho, una sola vía.
                apiVersion: 1.0.0
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalError"
  /me:
    get:
      operationId: getCurrentIdentity
      summary: Consultar identidad y membresías activas autorizadas
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Consultar identidad y membresías activas autorizadas
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/status:
    get:
      operationId: getAuthStatus
      summary: Consultar disponibilidad del emisor local
      security: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Consultar disponibilidad del emisor local
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Obtener token CSRF de sesión
      security: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Obtener token CSRF de sesión
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      operationId: beginLogin
      summary: Iniciar login OIDC real con PKCE
      security: []
      x-implementation-status: implemented
      responses:
        "303":
          description: Iniciar login OIDC real con PKCE
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Location:
              description: Destino fijo del inicio OIDC
              schema:
                type: string
                const: /api/v1/auth/authorize/local
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: false
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
      description: "Inicio BFF real: enviar X-CSRF-TOKEN o el campo _csrf del formulario. Debe existir un token CSRF
        válido de la misma sesión. No acepta un returnUrl arbitrario."
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - _csrf
              properties:
                _csrf:
                  type: string
                  minLength: 32
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidar sesión local
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "204":
          description: Invalidar sesión local
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
  /auth/tenant:
    post:
      operationId: authorizeTenant
      summary: Validar membresía activa del despacho
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Validar membresía activa del despacho
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRequest"
  /auth/invitations:
    post:
      operationId: createInvitation
      summary: Crear invitación local para issuer/subject exacto; owner con MFA reciente
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "201":
          description: Crear invitación local para issuer/subject exacto; owner con MFA reciente
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Consumir invitación atómica de un solo uso con cuota productiva
      description: V9 exige cupo USERS vigente; una invitación pendiente no consume plaza. La membresía, reserva
        correspondiente y auditoría/outbox se confirman juntas. QUOTA_UNAVAILABLE (409) conserva la invitación
        sin consumir.
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "200":
          description: Consumir invitación atómica de un solo uso
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitation"
  /auth/invitations/revoke:
    post:
      operationId: revokeInvitation
      summary: Revocar invitación no consumida
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "204":
          description: Revocar invitación no consumida
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeInvitation"
  /auth/memberships/status:
    post:
      operationId: changeMembershipStatus
      summary: Suspender o revocar membresía no propietaria; owner con MFA reciente
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      responses:
        "204":
          description: Suspender o revocar membresía no propietaria; owner con MFA reciente
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
            minLength: 32
          description: Token CSRF de la sesión same-origin; no es un token de identidad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipStatusRequest"
  /auth/authorize/local:
    get:
      operationId: redirectToLocalOidc
      summary: Redirect OIDC gestionado por Spring Security; requiere aprobación de login POST+CSRF de un uso.
      security: []
      x-implementation-status: implemented
      responses:
        "302":
          description: Redirect fijo al IdP local, o a /app o /login?error=autenticacion después del callback; nunca
            devuelve tokens.
          headers:
            Location:
              schema:
                type: string
              description: Destino de protocolo validado en configuración local.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/callback/local:
    get:
      operationId: completeLocalOidc
      summary: Callback OIDC gestionado por Spring Security; valida state/nonce/PKCE y token. No es un endpoint de
        identidad genérico.
      security: []
      x-implementation-status: implemented
      responses:
        "302":
          description: Redirect fijo al IdP local, o a /app o /login?error=autenticacion después del callback; nunca
            devuelve tokens.
          headers:
            Location:
              schema:
                type: string
              description: Destino de protocolo validado en configuración local.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenants/{tenantId}/team/invitation-options:
    get:
      operationId: localEmailInvitationOptions
      summary: Consultar disponibilidad de invitaciones manuales locales
      description: Sólo owner ACTIVE con MFA reciente, MEMBERSHIP_INVITE y despacho propio. No lista personas ni
        invitaciones.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Política local disponible; no implica envío de correo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalInvitationOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenants/{tenantId}/team/invitations:
    get:
      operationId: listTeamInvitations
      summary: Consultar invitaciones sin tokens ni hashes
      description: "Política A #33 aprobada: sólo owner del despacho ACTIVE, identidad/membresía ACTIVE y MFA
        confiable de los últimos 10 minutos. No habilita cartera ni administración global."
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: search
          description: Subcadena literal de nombre/correo, dentro del despacho; no interpreta comodines.
          schema:
            type: string
            maxLength: 80
            default: ""
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ALL
              - PENDING
              - ACCEPTED
              - REVOKED
              - EXPIRED
            default: ALL
      responses:
        "200":
          description: Resultado autorizado; no contiene tokens ni datos ajenos.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitationsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createVerifiedLocalEmailInvitation
      summary: Crear invitación manual para una identidad OIDC ya verificada
      description: >
        Exclusivamente Keycloak local/test con política de contacto explícita. Correo como localizador, nunca
        prueba de identidad. Fija issuer/subject exactos y conserva la aceptación original. Token aleatorio
        mostrado una sola vez; sólo hash persistido. Un replay devuelve token null, nunca el secreto anterior.
        No envía correo, no enumera destinatarios y no concede permisos de equipo adicionales. Pendientes no
        reservan plazas; la aceptación conserva la validación transaccional de capacidad V9.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalEmailInvitationRequest" }
      responses:
        "201":
          description: Invitación persistida; entrega manual pendiente. El token sólo aparece en esta primera respuesta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalEmailInvitation" }
        "200":
          description: Replay autorizado; sólo metadatos, token null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalEmailInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "500": { $ref: "#/components/responses/InternalError" }
  /tenants/{tenantId}/settings:
    parameters:
      - in: path
        name: tenantId
        required: true
        description: Candidato; cada operación verifica sesión, membresía, capacidad y estado. Un UUID no concede acceso.
        schema:
          type: string
          format: uuid
    get:
      operationId: getFirmSettings
      summary: Consultar configuración del despacho autorizado
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Configuración propia; canManage es presentación, nunca una autorización reutilizable.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: updateFirmSettings
      summary: Actualizar configuración con capacidad explícita y MFA reciente
      description: >
        Sesión, CSRF, membresía ACTIVE, despacho ACTIVE, TENANT_SETTINGS_MANAGE explícito y MFA verificable.
        Política limitada aprobada e instalada por V7 sólo para FIRM_OWNER_ADMIN del propio despacho; MFA
        confiable de los últimos diez minutos. Otros roles permanecen DENY. No permite cambiar owner, estado,
        logo, rol ni tenant. Idempotencia durable por tenant/actor/comando/huella; reintento idéntico devuelve
        la versión aplicada, incluso si hubo cambios posteriores. Volver a consultar GET para obtener el
        estado actual.
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFirmSettings"
      responses:
        "200":
          description: Versión aplicada; cambio, journal, outbox y recibo confirmados atómicamente.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmSettingsUpdated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenants/{tenantId}/entitlements:
    get:
      operationId: getTenantEntitlements
      summary: Consultar límites y uso del despacho con TENANT_PLAN_VIEW explícito
      description: V9 concede consulta sólo al owner ACTIVE con MFA confiable ≤10 minutos. Configuración ausente o
        vencida no significa capacidad ilimitada. Recursos futuros no publican consumo.
      security:
        - SessionCookie: []
      x-implementation-status: implemented
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Límites técnicos y medición autorizada
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                minItems: 6
                maxItems: 6
                items:
                  $ref: "#/components/schemas/EntitlementUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenants/{tenantId}/team/members:
    get:
      operationId: listTeamMembers
      summary: Consultar colaboradores del propio despacho
      description: "Política A #33 aprobada: sólo owner del despacho ACTIVE, identidad/membresía ACTIVE y MFA
        confiable de los últimos 10 minutos. No habilita cartera ni administración global."
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: &a1
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: search
          description: Subcadena literal de nombre/correo, dentro del despacho; no interpreta comodines.
          schema:
            type: string
            maxLength: 80
            default: ""
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ALL
              - ACTIVE
              - SUSPENDED
              - REVOKED
            default: ALL
      responses:
        "200":
          description: Resultado autorizado; no contiene tokens ni datos ajenos.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembersPage"
        "400": &a2
          $ref: "#/components/responses/BadRequest"
        "401": &a3
          $ref: "#/components/responses/Unauthorized"
        "403": &a4
          $ref: "#/components/responses/Forbidden"
        "404": &a5
          $ref: "#/components/responses/NotFound"
        "409": &a6
          $ref: "#/components/responses/Conflict"
        "422": &a7
          $ref: "#/components/responses/Validation"
        "500": &a8
          $ref: "#/components/responses/InternalError"
  /tenants/{tenantId}/team/members/{memberId}/status:
    post:
      operationId: changeTeamMemberStatus
      summary: Suspender, revocar o reactivar SUSPENDED sujeto a cuota
      description: "Política A #33 aprobada: sólo owner del despacho ACTIVE, identidad/membresía ACTIVE y MFA
        confiable de los últimos 10 minutos. No habilita cartera ni administración global."
      x-implementation-status: implemented
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: *a1
        - in: path
          name: memberId
          required: true
          schema: *a1
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: header
