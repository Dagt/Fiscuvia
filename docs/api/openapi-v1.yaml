components:
  headers:
    CorrelationId:
      description: UUID generado por el servidor; no refleja encabezados arbitrarios del solicitante
      schema:
        type: string
        format: uuid
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      in: query
      name: sort
      description: El endpoint debe restringir campos; orden secundario único por id en el repositorio
      schema:
        type: string
        pattern: ^[a-zA-Z][a-zA-Z0-9]{0,63},(asc|desc)$
        default: id,asc
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >
        Convención futura: UUID sintáctico. Cada mutación debe implementar scope autorizado, huella canónica,
        persistencia/replay y retención antes de prometer idempotencia. No se requiere ni se utiliza en GET
        /public/info.
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      description: "Candidato: validar membresía/contexto; nunca autoridad por sí solo."
      schema:
        type: string
        format: uuid
    TaxpayerId:
      name: taxpayerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token del mecanismo CSRF BFF existente, nunca registrar.
      schema:
        type: string
        minLength: 1
  schemas:
    TeamMember:
      type: object
      additionalProperties: false
      required:
        - membershipId
        - displayName
        - email
        - roles
        - status
        - identityStatus
        - version
        - joinedAt
        - changedAt
        - canManage
      properties:
        membershipId: &a2
          type: string
          format: uuid
        displayName:
          type:
            - string
            - "null"
          maxLength: 160
        email:
          type:
            - string
            - "null"
          maxLength: 254
          format: email
        roles:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - FIRM_OWNER_ADMIN
              - FIRM_SUPERVISOR
              - ACCOUNTANT
              - ASSISTANT
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - REVOKED
        identityStatus:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        version: &a3
          type: integer
          minimum: 0
          maximum: 9007199254740991
        joinedAt: &a1
          type: string
          format: date-time
        changedAt: *a1
        canManage:
          type: boolean
    TeamInvitation:
      type: object
      additionalProperties: false
      required:
        - invitationId
        - displayName
        - email
        - role
        - status
        - version
        - createdAt
        - expiresAt
      properties:
        invitationId: *a2
        displayName:
          type:
            - string
            - "null"
          maxLength: 160
        email:
          type:
            - string
            - "null"
          maxLength: 254
          format: email
        role: &a4
          type: string
          enum:
            - FIRM_SUPERVISOR
            - ACCOUNTANT
            - ASSISTANT
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REVOKED
            - EXPIRED
        version: *a3
        createdAt: *a1
        expiresAt: *a1
    TeamMembersPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TeamMember"
        page:
          type: integer
          minimum: 0
          maximum: 200
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
    TeamInvitationsPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TeamInvitation"
        page:
          type: integer
          minimum: 0
          maximum: 200
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
    TeamCommandResult:
      type: object
      additionalProperties: false
      required:
        - targetId
        - version
        - replayed
      properties:
        targetId: *a2
        version: *a3
        replayed:
          type: boolean
    TeamStatusCommand:
      type: object
      additionalProperties: false
      required:
        - status
        - expectedVersion
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - REVOKED
        expectedVersion: *a3
    TeamRoleCommand:
      type: object
      additionalProperties: false
      required:
        - role
        - expectedVersion
      properties:
        role: *a4
        expectedVersion: *a3
    TeamVersionCommand:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion: *a3
    PlatformInfo:
      type: object
      additionalProperties: false
      required:
        - productName
        - tagline
        - apiVersion
      properties:
        productName:
          type: string
          const: Fiscuvia
        tagline:
          type: string
          const: Todo tu despacho, una sola vía.
        apiVersion:
          type: string
          const: 1.0.0
    ExpectedVersion:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Versión exacta para Java long y JavaScript; una versión obsoleta produce 409 STALE_VERSION
    PageMetadata:
      type: object
      additionalProperties: false
      required:
        - page
        - size
        - hasNext
      properties:
        page:
          type: integer
          minimum: 0
          maximum: 10000
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasNext:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9]{0,63}$
        code:
          type: string
          enum:
            - REQUIRED
            - SIZE
            - FORMAT
            - RANGE
            - INVALID
        message:
          type: string
          minLength: 1
          maxLength: 120
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
        - fieldErrors
      description: >
        RFC 9457. Mensajes españoles fijos y seguros, sin valores rechazados, rutas, consultas SQL ni datos de
        infraestructura. El catálogo de códigos es infraestructura, no implementación de autenticación, reglas
        de negocio o rate limiting.
      properties:
        type:
          type: string
          format: uri
          pattern: ^urn:fiscuvia:problem:[a-z-]+$
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 405
            - 406
            - 409
            - 413
            - 415
            - 422
            - 429
            - 500
        detail:
          type: string
          minLength: 1
          maxLength: 240
        instance:
          type: string
          format: uri
          pattern: ^urn:uuid:[0-9a-f-]{36}$
        code:
          type: string
          enum:
            - BAD_REQUEST
            - INVALID_PAGINATION
            - AUTHENTICATION_REQUIRED
            - ACCESS_DENIED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - QUOTA_UNAVAILABLE
            - CONFLICT
            - STALE_VERSION
            - IDEMPOTENCY_KEY_REUSED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - VALIDATION_FAILED
            - RATE_LIMITED
            - INTERNAL_ERROR
        traceId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FieldError"
      example:
        type: urn:fiscuvia:problem:validation-failed
        title: Datos inválidos
        status: 422
        detail: Revisa los campos indicados antes de continuar.
        instance: urn:uuid:00000000-0000-4000-8000-000000000001
        code: VALIDATION_FAILED
        traceId: 00000000-0000-4000-8000-000000000001
        fieldErrors:
          - field: displayName
            code: REQUIRED
            message: Este campo es obligatorio.
    MembershipRole:
      type: string
      enum:
        - FIRM_OWNER_ADMIN
        - FIRM_SUPERVISOR
        - ACCOUNTANT
        - ASSISTANT
    Membership:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - membershipId
        - role
      properties:
        tenantId: &a1
          type: string
          format: uuid
        membershipId: *a1
        role:
          $ref: "#/components/schemas/MembershipRole"
        commercialName:
          description: Nombre persistido autorizado; null en raíces anteriores aún sin configurar. Nunca un nombre
            inventado.
          type:
            - string
            - "null"
          maxLength: 160
        tenantStatus:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
    LocalInvitationOptions:
      type: object
      additionalProperties: false
      required: [ emailInvitationsAvailable, delivery ]
      properties:
        emailInvitationsAvailable: { type: boolean }
        delivery: { type: string, const: MANUAL }
    LocalEmailInvitationRequest:
      type: object
      additionalProperties: false
      required: [ email, role ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [ FIRM_SUPERVISOR, ACCOUNTANT, ASSISTANT ] }
    LocalEmailInvitation:
      type: object
      additionalProperties: false
      required: [ invitationId, token, expiresAt, delivery, replayed ]
      properties:
        invitationId: { type: string, format: uuid }
        token:
          type: [ string, "null" ]
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Sólo primera respuesta de creación. Null en cualquier replay; nunca en listados, logs o auditoría.
        expiresAt: { type: string, format: date-time }
        delivery: { type: string, const: MANUAL }
        replayed: { type: boolean }
    FirmSettings:
      type: object
      additionalProperties: false
      required:
        - commercialName
        - contactEmail
        - phone
        - timeZone
        - locale
        - status
        - version
        - createdAt
        - updatedAt
        - canManage
        - logoReference
      properties:
        commercialName:
          type:
            - string
            - "null"
          maxLength: 160
        contactEmail:
          type:
            - string
            - "null"
          maxLength: 254
          format: email
        phone:
          type:
            - string
            - "null"
          maxLength: 30
        timeZone:
          $ref: "#/components/schemas/FirmTimeZone"
        locale:
          type: string
          const: es-MX
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        canManage:
          type: boolean
        logoReference:
          description: Sin almacenamiento privado aprobado; no admite uploads, URLs ni paths. Fallback visual por nombre.
          type: "null"
    FirmTimeZone:
      type: string
      enum:
        - America/Mexico_City
        - America/Cancun
        - America/Chihuahua
        - America/Ciudad_Juarez
        - America/Hermosillo
        - America/Mazatlan
        - America/Monterrey
        - America/Tijuana
    UpdateFirmSettings:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - commercialName
        - timeZone
        - locale
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        commercialName:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[^\u0000-\u001f\u007f]+$
        contactEmail:
          type:
            - string
            - "null"
          maxLength: 254
          format: email
        phone:
          type:
            - string
            - "null"
          pattern: ^[+0-9 ()-]{7,30}$
        timeZone:
          $ref: "#/components/schemas/FirmTimeZone"
        locale:
          type: string
          const: es-MX
    FirmSettingsUpdated:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    CurrentIdentity:
      type: object
      additionalProperties: false
      required:
        - userId
        - memberships
        - privilegedMfaVerified
      properties:
        userId: *a1
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        privilegedMfaVerified:
          type: boolean
    AuthStatus:
      type: object
      additionalProperties: false
      required:
        - loginAvailable
      properties:
        loginAvailable:
          type: boolean
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - headerName
        - token
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 32
    TenantRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
      properties:
        tenantId: *a1
    InviteRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - subject
        - role
      properties:
        tenantId: *a1
        subject:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          enum:
            - FIRM_SUPERVISOR
            - ACCOUNTANT
            - ASSISTANT
    Invitation:
      type: object
      additionalProperties: false
      required:
        - invitationId
        - token
        - expiresAt
      properties:
        invitationId: *a1
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          type: string
          format: date-time
    AcceptInvitation:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    AcceptedInvitation:
      type: object
      additionalProperties: false
      required:
        - tenantId
      properties:
        tenantId: *a1
    RevokeInvitation:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - invitationId
      properties:
        tenantId: *a1
        invitationId: *a1
    MembershipStatusRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - membershipId
        - status
      properties:
        tenantId: *a1
        membershipId: *a1
        status:
          type: string
          enum:
            - SUSPENDED
            - REVOKED
    EntitlementUsage:
      type: object
      additionalProperties: false
      required:
        - resource
        - limit
        - version
        - validFrom
        - validUntil
        - measured
        - reserved
        - available
        - overLimit
        - integration
      properties:
        resource:
          type: string
          enum:
            - USERS
            - TAXPAYERS
            - STORAGE_BYTES
            - JOBS_RUNNING
            - JOBS_PENDING
            - JOBS_PER_PERIOD
        limit: &a2
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        version: *a2
        validFrom: &a3
          type:
            - string
            - "null"
          format: date-time
        validUntil: *a3
        measured: *a2
        reserved: *a2
        available: *a2
        overLimit:
          type:
            - boolean
            - "null"
        integration:
          type: string
          enum:
            - MEASURED
            - NOT_INTEGRATED
    RegimeInput:
      type: object
      additionalProperties: false
      required:
        - code
        - validFrom
        - validTo
      properties:
        code:
          type: string
          pattern: ^[0-9]{3}$
          description: Referencia manual; no catálogo SAT vigente.
        validFrom:
          type:
            - string
            - "null"
          format: date
        validTo:
          type:
            - string
            - "null"
          format: date
      description: Captura manual aprobada, hasta10 referencias por perfil. Código de tres dígitos sin catálogo
        normativo. Fechas conocidas o ambas NULL; intervalos [desde,hasta) y solapamiento del mismo código
        comprobados por servidor, sin inferencia fiscal.
    RegimeReference:
      type: object
      additionalProperties: false
      required:
        - code
        - validFrom
        - validTo
        - source
        - reviewStatus
      properties:
        code:
          type: string
          pattern: ^[0-9]{3}$
          description: Referencia manual; no catálogo SAT vigente.
        validFrom:
          type:
            - string
            - "null"
          format: date
        validTo:
          type:
            - string
            - "null"
          format: date
        source:
          type: string
          const: MANUAL
        reviewStatus:
          type: string
          const: PENDING_REVIEW
    CreateTaxpayer:
      type: object
      additionalProperties: false
      required:
        - rfc
        - personType
        - legalName
        - tradeName
        - regimes
      properties:
        rfc:
          type: string
          minLength: 12
          maxLength: 32
          description: Entrada trim/NFC/uppercase de servidor; resultado12/13 según persona y estructura local. Rechazar
            sólo igualdad normalizada con XAXX010101000/XEXX010101000, no prefijos; sin excepciones ni
            existencia SAT.
        personType:
          type: string
          enum:
            - INDIVIDUAL
            - LEGAL_ENTITY
        legalName:
          type: string
          minLength: 1
          maxLength: 600
          description: Entrada con máximo600 unidades UTF-16. NFC y trim de servidor; nombre resultante obligatorio de
            máximo300 puntos de código.
        tradeName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 65536
          description: NULL o texto dentro del límite global de65536 bytes del cuerpo; NFC/trim y máximo200 puntos de
            código normalizados en servidor.
        regimes:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RegimeInput"
      x-server-validation:
        normalizedRfcRejectedValues:
          - XAXX010101000
          - XEXX010101000
        prefixRejection: false
        officialVerification: false
    ReplaceProfile:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - legalName
        - tradeName
        - regimes
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        legalName:
          type: string
          minLength: 1
          maxLength: 600
          description: Entrada con máximo600 unidades UTF-16. NFC y trim de servidor; nombre resultante obligatorio de
            máximo300 puntos de código.
        tradeName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 65536
          description: NULL o texto dentro del límite global de65536 bytes del cuerpo; NFC/trim y máximo200 puntos de
            código normalizados en servidor.
        regimes:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RegimeInput"
    ArchiveTaxpayer:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - reasonCode
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reasonCode:
          type: string
          enum:
            - SERVICE_ENDED
            - DUPLICATE_REVIEW
            - OTHER
    RestoreTaxpayer:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - reasonCode
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reasonCode:
          type: string
          enum:
            - SERVICE_RESUMED
            - CORRECTION
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
        - targetId
        - version
        - replayed
      properties:
        targetId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        replayed:
          type: boolean
    Taxpayer:
      type: object
      additionalProperties: false
      required:
        - id
        - rfc
        - personType
        - legalName
        - tradeName
        - status
        - version
        - createdAt
        - updatedAt
        - regimes
        - rfcValidation
        - officialVerification
      properties:
        id:
          type: string
          format: uuid
        rfc:
          type: string
          minLength: 12
          maxLength: 13
          pattern: ^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$
        personType:
          type: string
          enum:
            - INDIVIDUAL
            - LEGAL_ENTITY
        legalName:
          type: string
          minLength: 1
          maxLength: 300
        tradeName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        regimes:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RegimeReference"
        rfcValidation:
          type: string
          const: RFC_LOCAL_STRUCTURE_V1
        officialVerification:
          type: string
          const: NOT_PERFORMED
    TaxpayerPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - hasNext
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Taxpayer"
        page:
          type: integer
          minimum: 0
          maximum: 10000
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasNext:
          type: boolean
  responses:
    BadRequest:
      description: Sintaxis, tipo o parámetro inválido (400)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Sesión ausente, inválida o expirada (401). El BFF no acepta Bearer tokens.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: CSRF inválido, membresía/rol/MFA insuficiente o invitación rechazada (403); no confirma existencia.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Recurso no disponible (404); no confirma existencia entre despachos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Conflicto, versión obsoleta o clave reutilizada (409)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Validation:
      description: DTO bien formado pero inválido, o regla de dominio futura (422)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Límite de solicitudes (429); enforcement futuro
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotAcceptable:
      description: Formato de respuesta no admitido (406)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: Error interno con mensaje seguro (500)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooLarge:
      description: Body excede 64 KiB.
      headers:
        Cache-Control:
          description: Siempre no-store.
          schema:
            type: string
            const: no-store
        X-Correlation-Id:
          description: UUID generado por servidor.
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    MediaType:
      description: Se requiere application/json.
      headers:
        Cache-Control:
          description: Siempre no-store.
          schema:
            type: string
            const: no-store
        X-Correlation-Id:
          description: UUID generado por servidor.
          schema:
            type: string
            format: uuid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-FiscuviaSession
      description: Sesión BFF HttpOnly Secure SameSite=Lax. No tokens OAuth en el navegador. Mutaciones requieren
        X-CSRF-TOKEN obtenido en /auth/csrf.
