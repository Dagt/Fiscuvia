name: Feature / vertical slice
description: Scoped implementation task linked to an epic
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: User outcome and scope
      description: Explain the user problem, actor and expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "Given / When / Then; include permissions, tenant isolation, errors, UX"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / docs / out-of-scope
    validations:
      required: true
  - type: textarea
    id: testplan
    attributes:
      label: Test and visual evidence plan
    validations:
      required: true
