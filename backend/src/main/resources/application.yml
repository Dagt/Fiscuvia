spring:
  application:
    name: fiscuvia-backend
  main:
    banner-mode: off
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: fiscuvia-runtime
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 1
  sql:
    init:
      mode: never
  session:
    timeout: 15m
    jdbc:
      initialize-schema: never
      table-name: auth_sessions.SPRING_SESSION
      cleanup-cron: '0 * * * * *'
  flyway:
    locations: classpath:db/migration
    default-schema: infrastructure
    create-schemas: true
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
    connect-retries: 0

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: __Host-FiscuviaSession
        path: /
        http-only: true
        secure: true
        same-site: lax
fiscuvia:
  identity:
    proof-key: ${FISCUVIA_ACTOR_PROOF_KEY}
    enabled: ${FISCUVIA_OIDC_ENABLED:false}
    issuer: ${FISCUVIA_OIDC_ISSUER:}
    client-id: ${FISCUVIA_OIDC_CLIENT_ID:fiscuvia-local}
    client-secret: ${FISCUVIA_OIDC_CLIENT_SECRET:}
    origin: ${FISCUVIA_ORIGIN:https://127.0.0.1:8443}
    mfa-policy: ${FISCUVIA_OIDC_MFA_POLICY:unverified}

management:
  tracing:
    sampling:
      probability: ${FISCUVIA_TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    use-global-registry: false
  defaults:
    metrics:
      export:
        enabled: false
  simple:
    metrics:
      export:
        enabled: true
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    metrics:
      access: none

logging:
  structured:
    format:
      console: com.fiscuvia.platform.internal.observability.AllowlistLogFormatter
      file: com.fiscuvia.platform.internal.observability.AllowlistLogFormatter
  level:
    root: WARN
    com.fiscuvia: INFO
