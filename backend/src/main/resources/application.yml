spring:
  application:
    name: fiscuvia-backend
  main:
    banner-mode: off
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: fiscuvia-runtime
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: 1
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
    default-schema: infrastructure
    create-schemas: true
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
    connect-retries: 0

server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  tracing:
    sampling:
      probability: ${FISCUVIA_TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    use-global-registry: false
  defaults:
    metrics:
      export:
        enabled: false
  simple:
    metrics:
      export:
        enabled: true
  endpoints:
    access:
      default: none
    web:
      discovery:
        enabled: false
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    metrics:
      access: none

logging:
  structured:
    format:
      console: com.fiscuvia.platform.internal.observability.AllowlistLogFormatter
      file: com.fiscuvia.platform.internal.observability.AllowlistLogFormatter
  level:
    root: WARN
    com.fiscuvia: INFO
